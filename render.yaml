services:
  - type: web
    name: equal-backend
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main
    nodeVersion: "20.11.0"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NPM_CONFIG_CACHE
        value: /tmp/npm-cache
      - key: PI_API_KEY
        value: h1p5wbaq0kgnnyhhpir0ngt0ozvltsifveghqfpwmxxnbau1fju0kajg0u6ferap
    healthCheckPath: /v1/health

databases:
  - name: equal-db
    plan: starter
    postgresMajorVersion: 16
