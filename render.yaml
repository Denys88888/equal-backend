services:
  - type: web
    name: equal-backend
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npx prisma db seed && node dist/main
    nodeVersion: "20.11.0"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NPM_CONFIG_CACHE
        value: /tmp/npm-cache
      # Comma-separated Pi usernames granted the admin panel, matched
      # case-insensitively. Authoritative while set: removing a name here
      # demotes that account on its next login.
      - key: ADMIN_PI_USERNAMES
        value: Cherry19899
      # Set in the Render dashboard only — it must be the API key of the Equal
      # MAINNET app. A key from any other app (the Testnet one included) is
      # still accepted by Pi, but cannot see Equal's payments, so every approve
      # fails with payment_not_found. /v1/health → payments_last shows this.
      - key: PI_API_KEY
        sync: false
    healthCheckPath: /v1/health

databases:
  - name: equal-db
    plan: starter
    postgresMajorVersion: 16
